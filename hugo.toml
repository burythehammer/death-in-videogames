title = 'Death in Videogames'
baseURL = 'https://www.burythehammer.com/death-in-videogames/'
locale = 'en-us'

# No section/taxonomy/term listing pages exist on this site (tags are
# metadata only, not browsable)
disableKinds = ['section', 'taxonomy', 'term']

[params]
  description = 'Examining the relationship between games and death'
  author = 'The Author'

[permalinks.page]
  posts = '/:year/:month/:day/:slug/'

[pagination]
  pagerSize = 1

# Explicit related-content config so posts still surface as "related" on a
# small site with few/no overlapping tags (falls back to same-year date
# match), matching Jekyll's naive "other recent posts" related_posts default
[related]
  threshold = 0
  includeNewer = false
  toLower = false

  [[related.indices]]
    name = 'tags'
    weight = 70

  [[related.indices]]
    name = 'date'
    pattern = '2006'
    weight = 10
