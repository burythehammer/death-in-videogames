{{ define "main" }}
<div class="post">
  <h1 class="post-title">{{ .Title }}</h1>
  <span class="post-date">{{ .Date.Format "2 Jan 2006" }}</span>
  {{ .Content }}
</div>

<div class="related">
  <h2>Related Posts</h2>
  <ul class="related-posts">
    {{ range first 3 (site.RegularPages.Related .) }}
      <li>
        <h3>
          <a href="{{ .RelPermalink }}">
            {{ .Title }}
            <small>{{ .Date.Format "2 Jan 2006" }}</small>
          </a>
        </h3>
      </li>
    {{ end }}
  </ul>
</div>
{{ end }}
