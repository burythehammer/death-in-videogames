<!DOCTYPE html>
<html lang="en-us">

<head>
  <link href="http://gmpg.org/xfn/11" rel="profile">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta http-equiv="content-type" content="text/html; charset=utf-8">

  <!-- Enable responsiveness on mobile devices-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">

  <title>
    {{ if .IsHome }}
      {{ site.Title }}
    {{ else }}
      {{ .Title }} :: {{ site.Title }}
    {{ end }}
  </title>

  <!-- CSS -->
  <link rel="stylesheet" href="{{ "css/poole.css" | relURL }}">
  <link rel="stylesheet" href="{{ "css/syntax.css" | relURL }}">
  <link rel="stylesheet" href="{{ "css/hyde.css" | relURL }}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=PT+Sans:400,400italic,700|Abril+Fatface">

  <!-- Icons -->
  <link rel="apple-touch-icon-precomposed" sizes="144x144" href="{{ "apple-touch-icon-144-precomposed.png" | relURL }}">
  <link rel="shortcut icon" href="{{ "favicon.ico" | relURL }}">

  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml" title="RSS" href="{{ "index.xml" | relURL }}">
</head>

<body>

  <div class="sidebar">
    <div class="container sidebar-sticky">
      <div class="sidebar-about">
        <h1>
          <a href="{{ "" | relURL }}">
            {{ site.Title }}
          </a>
        </h1>
        <p class="lead">{{ site.Params.description }}</p>
      </div>

      <nav class="sidebar-nav">
        <a class="sidebar-nav-item{{ if .IsHome }} active{{ end }}" href="{{ "" | relURL }}">Home</a>
      </nav>

      <p>&copy; {{ now.Format "2006" }}. 💀</p>
    </div>
  </div>

  <div class="content container">
    {{ block "main" . }}{{ end }}
  </div>

</body>

</html>
